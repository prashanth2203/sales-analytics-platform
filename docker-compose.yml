services:
  postgres:
    image: postgres:15-alpine
    container_name: sales_postgres
    environment:
      POSTGRES_USER: sales_user
      POSTGRES_PASSWORD: sales_password
      POSTGRES_DB: sales_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: sales_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-setup:
    image: minio/mc
    container_name: sales_minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb myminio/raw || true;
      /usr/bin/mc policy set public myminio/raw;
      exit 0;
      "

  etl:
    build:
      context: ./etl
      dockerfile: Dockerfile
    container_name: sales_etl
    environment:
      DATABASE_URL: "postgresql://sales_user:sales_password@postgres:5432/sales_db?schema=public"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - minio

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales_backend
    environment:
      DATABASE_URL: "postgresql://sales_user:sales_password@postgres:5432/sales_db?schema=public"
      PORT: 5000
      ETL_SERVICE_URL: "http://etl:8000"
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - etl

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sales_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
